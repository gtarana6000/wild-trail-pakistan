<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WILD TRAIL PAKISTAN</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #071b17;
    font-family: Arial, sans-serif;
}

.brand {
    text-align: center;
    padding: 30px;
}

.brand h1 {
    color: #ffffff;
    font-size: clamp(30px, 7vw, 65px);
    font-weight: 900;
    letter-spacing: 5px;
    text-transform: uppercase;
    text-shadow: 0 0 20px #18b88766;
}

.brand h1 span {
    color: #28d69a;
}

.brand p {
    color: #b5d9cb;
    margin-top: 18px;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
}

.line {
    width: 100px;
    height: 4px;
    background: #28d69a;
    margin: 22px auto 0;
    border-radius: 5px;
}
</style>
</head>

<body>

<div class="brand">
    <h1>WILD TRAIL <span>PAKISTAN</span></h1>
    <div class="line"></div>
    <p>Explore • Discover • Adventure</p>
</div>

</body>
</html>
